<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emoji Picker</title>
<style>
body{font-family:Arial;background:#fdf4ff;padding:25px}
main{max-width:550px;margin:auto;background:white;padding:25px;border-radius:15px}
input{width:100%;padding:12px;box-sizing:border-box;margin:10px 0}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.emoji{font-size:30px;padding:12px;border:0;background:#fae8ff;border-radius:8px;cursor:pointer}
#selected{font-size:45px;text-align:center;margin:20px}
button.copy{padding:11px 18px;background:#a21caf;color:white;border:0;border-radius:7px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Emoji Picker</h1>
<input id="search" placeholder="Search emoji by name...">
<div id="selected">😀</div>
<div id="grid"></div>
<p id="status"></p>
<button class="copy" onclick="copyEmoji()">Copy Selected Emoji</button>
</main>
<script>
const emojis=[
 ["😀","smile"],["😂","laugh"],["❤️","love"],["😍","heart eyes"],
 ["😎","cool"],["🥳","party"],["😭","cry"],["👍","thumbs up"],
 ["🔥","fire"],["🌟","star"],["🎉","celebration"],["🚀","rocket"],
 ["🍎","apple"],["🐱","cat"],["⚽","football"],["🌈","rainbow"],
 ["💡","idea"],["🎵","music"],["☀️","sun"],["🌙","moon"]
];
let selected="😀";
function render(){
 const query=document.getElementById("search").value.toLowerCase();
 const grid=document.getElementById("grid");
 grid.innerHTML="";
 emojis.filter(x=>x[1].includes(query)).forEach(item=>{
  const btn=document.createElement("button");
  btn.className="emoji";
  btn.textContent=item[0];
  btn.title=item[1];
  btn.onclick=()=>{selected=item[0];document.getElementById("selected").textContent=selected;};
  grid.appendChild(btn);
 });
}
document.getElementById("search").addEventListener("input",render);
async function copyEmoji(){
 try{
  await navigator.clipboard.writeText(selected);
  document.getElementById("status").textContent="Emoji copied!";
 }catch{
  document.getElementById("status").textContent="Please copy the emoji manually.";
 }
}
render();
</script>
</body>
</html>
